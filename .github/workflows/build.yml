name: Build Windows installer

on:
  workflow_dispatch:        # lets you click "Run workflow" on GitHub
  push:
    tags: ['v*']            # or push a tag like v0.3.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: Prayer-Pause-Setup
          path: dist/*.exe
