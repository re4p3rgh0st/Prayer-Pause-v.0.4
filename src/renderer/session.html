<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Prayer Pause</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="session">
  <svg class="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <circle cx="500" cy="170" r="220" fill="url(#glow)"/><circle cx="500" cy="170" r="70" class="moon"/>
    <g class="stars"><circle cx="120" cy="80" r="1.6"/><circle cx="260" cy="190" r="1.2"/><circle cx="800" cy="60" r="1.5"/><circle cx="900" cy="220" r="1.2"/><circle cx="700" cy="120" r="1"/><circle cx="330" cy="50" r="1.3"/></g>
  </svg>
  <main class="center">
    <div class="dim" id="sub">Time to pray</div>
    <h1 id="title">Prayer Pause</h1>
    <div id="count" class="huge">15:00</div>
    <p class="dim2" id="note">Take your time. Your apps can wait.</p>
    <button id="end" class="btn" hidden>End early</button>
    <div id="proof" class="proof" hidden>
      <img id="qr" alt="QR code to open the photo page on your phone" width="200" height="200" hidden>
      <p class="dim2">On your phone (same Wi-Fi as this PC), scan the code or open:</p>
      <p id="url" class="url"></p>
      <p id="proofMsg" class="dim2"></p>
      <button id="cancelProof" class="btn">Cancel</button>
    </div>
  </main>
  <script src="js/session.js"></script>
</body>
</html>
